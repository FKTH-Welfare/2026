<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FUJIKOKI Lucky Draw - รอผลการประกาศรางวัล</title>
<style>
    :root {
        --stage-1: #2b0b5e;
        --stage-2: #7c1f8f;
        --stage-3: #ff3d81;
        --paper: #fffdf7;
        --paper-dim: #fff2df;
        --gold: #ffb703;
        --gold-light: #ffe066;
        --crimson: #ff4d6d;
        --teal: #00c2a8;
        --violet: #7c3aed;
        --ink: #241b3a;
        --muted: #8b7fa3;
    }

    * { box-sizing: border-box; }

    body {
        font-family: 'Sarabun', 'Tahoma', 'TH Sarabun New', sans-serif;
        background:
            radial-gradient(circle at 15% 10%, rgba(255,61,129,.55), transparent 45%),
            radial-gradient(circle at 85% 15%, rgba(0,194,168,.45), transparent 40%),
            radial-gradient(circle at 50% 100%, rgba(124,58,237,.5), transparent 55%),
            linear-gradient(160deg, var(--stage-1), var(--stage-2) 60%, var(--stage-3) 130%);
        min-height: 100vh;
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px 16px;
        overflow: hidden;
        position: relative;
    }

    .stage-deco {
        position: fixed;
        inset: 0;
        pointer-events: none;
        background-image:
            radial-gradient(2px 2px at 12% 20%, rgba(255,224,102,.9) 50%, transparent 51%),
            radial-gradient(2px 2px at 82% 30%, rgba(0,194,168,.8) 50%, transparent 51%),
            radial-gradient(2.5px 2.5px at 30% 70%, rgba(255,77,109,.7) 50%, transparent 51%),
            radial-gradient(2px 2px at 70% 82%, rgba(255,224,102,.8) 50%, transparent 51%),
            radial-gradient(2.5px 2.5px at 90% 60%, rgba(124,58,237,.7) 50%, transparent 51%),
            radial-gradient(2px 2px at 45% 40%, rgba(255,255,255,.6) 50%, transparent 51%);
    }

    /* ===== Confetti ===== */
    #confetti {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 0;
        overflow: hidden;
    }

    .confetti-piece {
        position: absolute;
        top: -20px;
        opacity: 0.9;
        animation-name: confetti-fall;
        animation-timing-function: linear;
        animation-iteration-count: infinite;
        will-change: transform;
    }

    @keyframes confetti-fall {
        0% {
            transform: translateY(0) translateX(0) rotate(0deg);
            opacity: 0;
        }
        8% {
            opacity: 0.9;
        }
        92% {
            opacity: 0.85;
        }
        100% {
            transform: translateY(110vh) translateX(var(--drift, 30px)) rotate(var(--spin, 360deg));
            opacity: 0;
        }
    }

    .ticket-wrap {
        position: relative;
        width: 100%;
        max-width: 420px;
        z-index: 1;
    }

    .ticket-wrap::before,
    .ticket-wrap::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 18px;
        z-index: 0;
    }
    .ticket-wrap::before {
        background: var(--teal);
        transform: rotate(-4deg) translateY(2px);
        opacity: .6;
    }
    .ticket-wrap::after {
        background: var(--gold);
        transform: rotate(3deg) translateY(4px);
        opacity: .55;
    }

    .ticket {
        position: relative;
        z-index: 1;
        background: var(--paper);
        border-radius: 18px;
        border: 1px solid rgba(255,224,102,.5);
        box-shadow: 0 28px 70px rgba(43,11,94,.55), 0 0 0 1px rgba(0,0,0,.15);
        overflow: hidden;
    }

    .ticket__stub {
        background: linear-gradient(120deg, #ff4d6d, #ff9a3c 55%, #ffc233);
        padding: 22px 26px 18px;
        text-align: center;
        position: relative;
        border-bottom: 2px solid var(--gold);
    }
    .ticket__stub .brand {
        font-weight: 800;
        font-size: 13px;
        letter-spacing: 4px;
        color: #fff;
        text-transform: uppercase;
        text-shadow: 0 1px 3px rgba(0,0,0,.15);
    }
    .ticket__stub h1 {
        margin: 6px 0 4px;
        font-size: 22px;
        font-weight: 800;
        color: #fff;
        letter-spacing: .3px;
        text-shadow: 0 2px 6px rgba(0,0,0,.2);
    }
    .ticket__stub .event {
        font-size: 12.5px;
        color: rgba(255,255,255,.9);
        letter-spacing: .5px;
        font-weight: 600;
    }

    .perforation {
        height: 18px;
        background:
            radial-gradient(circle 7px at 0 50%, transparent 99%, var(--paper) 100%),
            radial-gradient(circle 9px at center, var(--stage-1) 9px, transparent 9.5px);
        background-size: 22px 18px;
        background-repeat: repeat-x;
        background-position: 4px center;
        background-color: transparent;
    }

    .ticket__main {
        padding: 30px 24px 26px;
        position: relative;
        text-align: center;
    }

    /* Spinning drum icon - signature element echoing the physical lucky-draw drum */
    .drum {
        position: relative;
        width: 96px;
        height: 96px;
        margin: 0 auto 22px;
    }
    .drum svg { width: 100%; height: 100%; }
    .drum .cage {
        animation: spin-drum 3.2s linear infinite;
        transform-origin: 48px 48px;
    }
    @keyframes spin-drum {
        to { transform: rotate(360deg); }
    }
    @media (prefers-reduced-motion: reduce) {
        .drum .cage { animation: none; }
        .status-dot { animation: none !important; }
        .confetti-piece { animation: none !important; display: none; }
    }

    h2 {
        font-size: 19px;
        font-weight: 800;
        color: var(--ink);
        margin: 0 0 10px;
        line-height: 1.5;
    }

    .status-row {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        margin: 0 0 18px;
        font-size: 12.5px;
        font-weight: 700;
        color: var(--violet);
        background: #f4edff;
        padding: 6px 14px;
        border-radius: 999px;
    }
    .status-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--crimson);
        animation: dot-pulse 1.4s ease-in-out infinite;
        flex-shrink: 0;
    }
    @keyframes dot-pulse {
        0%, 100% { opacity: .35; transform: scale(.8); }
        50% { opacity: 1; transform: scale(1.15); }
    }

    p.body-text {
        font-size: 14px;
        line-height: 1.85;
        color: var(--muted);
        margin: 0 0 20px;
    }

    /* ===== Countdown ===== */
    .countdown {
        display: flex;
        justify-content: center;
        gap: 8px;
        margin: 0 0 20px;
        flex-wrap: wrap;
    }

    .countdown .segment {
        background: var(--paper-dim);
        border: 1.5px dashed var(--gold);
        border-radius: 12px;
        padding: 10px 12px;
        min-width: 62px;
    }

    .countdown .segment .num {
        display: block;
        font-size: 22px;
        font-weight: 800;
        color: var(--crimson);
        font-variant-numeric: tabular-nums;
    }

    .countdown .segment .label {
        display: block;
        font-size: 11px;
        color: var(--muted);
        font-weight: 700;
        margin-top: 3px;
        letter-spacing: .3px;
    }

    .detail-box {
        text-align: left;
        border: 1.5px dashed var(--gold);
        background: var(--paper-dim);
        border-radius: 14px;
        padding: 16px 18px;
    }
    .detail-row {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        font-size: 13px;
        padding: 7px 0;
    }
    .detail-row + .detail-row {
        border-top: 1px dashed #ecd9ad;
    }
    .detail-label { color: var(--muted); font-weight: 600; }
    .detail-value { color: var(--ink); font-weight: 700; text-align: right; }

    footer {
        text-align: center;
        font-size: 11.5px;
        color: var(--muted);
        margin-top: 18px;
        letter-spacing: .2px;
    }

    @media (max-width: 380px) {
        body { padding: 20px 10px; }
        .ticket__stub { padding: 20px 18px 16px; }
        .ticket__main { padding: 26px 18px 22px; }
        .countdown .segment { min-width: 52px; padding: 8px 10px; }
        .countdown .segment .num { font-size: 18px; }
    }
</style>
</head>
<body>
<div class="stage-deco"></div>
<div id="confetti"></div>

<div class="ticket-wrap">
    <div class="ticket">
        <div class="ticket__stub">
            <div class="brand">FUJIKOKI</div>
            <h1>LUCKY DRAW</h1>
            <div class="event">New Year Party 2026</div>
        </div>
        <div class="perforation"></div>
        <div class="ticket__main">

            <div class="drum">
                <svg viewBox="0 0 96 96" fill="none">
                    <circle cx="48" cy="48" r="44" stroke="#ffd9a0" stroke-width="2"/>
                    <g class="cage">
                        <circle cx="48" cy="48" r="34" stroke="#ff9a3c" stroke-width="2" stroke-dasharray="4 7" stroke-linecap="round"/>
                        <circle cx="48" cy="20" r="4" fill="#ffb703"/>
                        <circle cx="72" cy="42" r="3.5" fill="#ff4d6d"/>
                        <circle cx="62" cy="70" r="4" fill="#00c2a8"/>
                        <circle cx="30" cy="70" r="3" fill="#7c3aed"/>
                        <circle cx="22" cy="40" r="3.5" fill="#ffe066"/>
                    </g>
                    <circle cx="48" cy="48" r="10" fill="#fff5df" stroke="#ffb703" stroke-width="1.5"/>
                </svg>
            </div>

            <h2>อยู่ระหว่างการรอผลรางวัล</h2>

            <div class="countdown" id="countdown">
    <div class="segment"><span class="num" id="cd-days">00</span><span class="label">วัน</span></div>
    <div class="segment"><span class="num" id="cd-hours">00</span><span class="label">ชม.</span></div>
    <div class="segment"><span class="num" id="cd-minutes">00</span><span class="label">นาที</span></div>
    <div class="segment"><span class="num" id="cd-seconds">00</span><span class="label">วินาที</span></div>
</div>

            <p class="body-text">
                หลังประกาศแล้วสามารถกรอกรหัสพนักงาน<br>เพื่อตรวจสอบผลรางวัลได้ทันที
            </p>

           <div class="detail-box">
    <div class="detail-row">
        <span class="detail-label">วันที่ประกาศ</span>
        <span class="detail-value">19 ธ.ค. 2569</span>
    </div>
    <div class="detail-row">
        <span class="detail-label">เวลาประกาศ</span>
        <span class="detail-value">21:00 น.</span>
    </div>
</div>

            <footer>หน้านี้จะอัปเดตอัตโนมัติเมื่อมีการประกาศผล</footer>
        </div>
    </div>
</div>

<script>
    // ===== Countdown timer to 21:00 today (or tomorrow if already passed) =====
    function getTargetTime() {
        const now = new Date();
        const target = new Date();
        target.setHours(21, 0, 0, 0);
        if (target <= now) {
            target.setDate(target.getDate() + 1);
        }
        return target;
    }

// ===== Countdown timer to 19 Dec 2026, 21:00 =====
const targetDate = new Date('2026-12-19T21:00:00');

function updateCountdown() {
    const now = new Date();
    let diff = targetDate - now;

    if (diff < 0) diff = 0;

    const days = Math.floor(diff / (1000 * 60 * 60 * 24));
    const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
    const minutes = Math.floor((diff / (1000 * 60)) % 60);
    const seconds = Math.floor((diff / 1000) % 60);

    document.getElementById('cd-days').textContent = String(days).padStart(2, '0');
    document.getElementById('cd-hours').textContent = String(hours).padStart(2, '0');
    document.getElementById('cd-minutes').textContent = String(minutes).padStart(2, '0');
    document.getElementById('cd-seconds').textContent = String(seconds).padStart(2, '0');
}

updateCountdown();
setInterval(updateCountdown, 1000);

    // ===== Confetti =====
    const confettiContainer = document.getElementById('confetti');
    const CONFETTI_COUNT = 40;
    const colors = ['#ff4d6d', '#ffb703', '#00c2a8', '#7c3aed', '#ffe066', '#ff9a3c'];

    for (let i = 0; i < CONFETTI_COUNT; i++) {
        const piece = document.createElement('div');
        piece.className = 'confetti-piece';

        const width = Math.random() * 6 + 5;   // 5px - 11px
        const height = width * (Math.random() * 0.6 + 0.8); // slight variation
        const left = Math.random() * 100; // %
        const duration = Math.random() * 6 + 7; // 7s - 13s
        const delay = Math.random() * 12; // 0s - 12s
        const drift = (Math.random() * 100 - 50) + 'px';
        const spin = (Math.random() * 540 + 180) + 'deg';
        const color = colors[Math.floor(Math.random() * colors.length)];
        const isRound = Math.random() > 0.5;

        piece.style.width = width + 'px';
        piece.style.height = height + 'px';
        piece.style.left = left + '%';
        piece.style.background = color;
        piece.style.borderRadius = isRound ? '50%' : '2px';
        piece.style.animationDuration = duration + 's';
        piece.style.animationDelay = delay + 's';
        piece.style.setProperty('--drift', drift);
        piece.style.setProperty('--spin', spin);

        confettiContainer.appendChild(piece);
    }
</script>

</body>
</html>
