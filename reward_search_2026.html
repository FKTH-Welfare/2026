<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FUJIKOKI Lucky Draw - ค้นหารางวัล</title>
<style>
    :root {
        --stage-1: #2b0b5e;
        --stage-2: #7c1f8f;
        --stage-3: #ff3d81;
        --paper: #fffdf7;
        --paper-dim: #fff2df;
        --gold: #ffb703;
        --gold-light: #ffe066;
        --crimson: #ff4d6d;
        --teal: #00c2a8;
        --violet: #7c3aed;
        --ink: #241b3a;
        --muted: #8b7fa3;
        --success: #00b37e;
        --success-bg: #e6fbf3;
    }

    * { box-sizing: border-box; }

    body {
        font-family: 'Sarabun', 'Tahoma', 'TH Sarabun New', sans-serif;
        background:
            radial-gradient(circle at 15% 10%, rgba(255,61,129,.55), transparent 45%),
            radial-gradient(circle at 85% 15%, rgba(0,194,168,.45), transparent 40%),
            radial-gradient(circle at 50% 100%, rgba(124,58,237,.5), transparent 55%),
            linear-gradient(160deg, var(--stage-1), var(--stage-2) 60%, var(--stage-3) 130%);
        min-height: 100vh;
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px 16px;
    }

    .stage-deco {
        position: fixed;
        inset: 0;
        pointer-events: none;
        background-image:
            radial-gradient(2px 2px at 12% 20%, rgba(255,224,102,.9) 50%, transparent 51%),
            radial-gradient(2px 2px at 82% 30%, rgba(0,194,168,.8) 50%, transparent 51%),
            radial-gradient(2.5px 2.5px at 30% 70%, rgba(255,77,109,.7) 50%, transparent 51%),
            radial-gradient(2px 2px at 70% 82%, rgba(255,224,102,.8) 50%, transparent 51%),
            radial-gradient(2.5px 2.5px at 90% 60%, rgba(124,58,237,.7) 50%, transparent 51%),
            radial-gradient(2px 2px at 45% 40%, rgba(255,255,255,.6) 50%, transparent 51%);
    }

    .ticket-wrap {
        position: relative;
        width: 100%;
        max-width: 420px;
    }

    .ticket-wrap::before,
    .ticket-wrap::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 18px;
        z-index: 0;
    }
    .ticket-wrap::before {
        background: var(--teal);
        transform: rotate(-4deg) translateY(2px);
        opacity: .6;
    }
    .ticket-wrap::after {
        background: var(--gold);
        transform: rotate(3deg) translateY(4px);
        opacity: .55;
    }

    .ticket {
        position: relative;
        z-index: 1;
        background: var(--paper);
        border-radius: 18px;
        border: 1px solid rgba(255,224,102,.5);
        box-shadow: 0 28px 70px rgba(43,11,94,.55), 0 0 0 1px rgba(0,0,0,.15);
        overflow: hidden;
    }

    .ticket__stub {
        background: linear-gradient(120deg, #ff4d6d, #ff9a3c 55%, #ffc233);
        padding: 22px 26px 18px;
        text-align: center;
        position: relative;
        border-bottom: 2px solid var(--gold);
    }
    .ticket__stub .brand {
        font-weight: 800;
        font-size: 13px;
        letter-spacing: 4px;
        color: #fff;
        text-transform: uppercase;
        text-shadow: 0 1px 3px rgba(0,0,0,.15);
    }
    .ticket__stub h1 {
        margin: 6px 0 4px;
        font-size: 22px;
        font-weight: 800;
        color: #fff;
        letter-spacing: .3px;
        text-shadow: 0 2px 6px rgba(0,0,0,.2);
    }
    .ticket__stub .event {
        font-size: 12.5px;
        color: rgba(255,255,255,.9);
        letter-spacing: .5px;
        font-weight: 600;
    }
    .ticket__stub .admit {
        position: absolute;
        top: 16px;
        right: 18px;
        font-size: 10px;
        letter-spacing: 2px;
        color: #fff;
        border: 1px solid rgba(255,255,255,.7);
        border-radius: 999px;
        padding: 3px 9px;
    }

    .perforation {
        height: 18px;
        background:
            radial-gradient(circle 7px at 0 50%, transparent 99%, var(--paper) 100%),
            radial-gradient(circle 9px at center, var(--stage-1) 9px, transparent 9.5px);
        background-size: 22px 18px;
        background-repeat: repeat-x;
        background-position: 4px center;
        background-color: transparent;
    }
    .perforation::after { content: none; }

    .ticket__main {
        padding: 22px 20px 20px;
        position: relative;
    }

    .prompt {
        text-align: center;
        color: var(--ink);
        font-size: 14.5px;
        font-weight: 700;
        margin: 0 0 14px;
    }

    form {
        display: flex;
        gap: 8px;
        margin-bottom: 6px;
    }
    input[type=text] {
        flex: 1;
        min-width: 0;
        padding: 14px 15px;
        border: 2px solid #ffd9a0;
        background: #fff;
        border-radius: 10px;
        font-size: 16px;
        font-family: inherit;
        color: var(--ink);
        outline: none;
        transition: border-color .2s, box-shadow .2s;
    }
    input[type=text]::placeholder { color: #c2b3d6; }
    input[type=text]:focus {
        border-color: var(--violet);
        box-shadow: 0 0 0 3px rgba(124,58,237,.2);
    }
    button {
        flex-shrink: 0;
        background: linear-gradient(135deg, var(--crimson), var(--violet));
        color: #fff;
        border: none;
        border-radius: 10px;
        padding: 0 20px;
        font-size: 15px;
        font-weight: 700;
        font-family: inherit;
        cursor: pointer;
        transition: filter .2s, transform .1s;
    }
    button:hover { filter: brightness(1.08); }
    button:active { transform: scale(.97); }

    #result { min-height: 20px; margin-top: 16px; position: relative; overflow: hidden; }

    .emp-name {
        text-align: center;
        color: var(--muted);
        font-size: 13.5px;
        margin-bottom: 12px;
    }
    .emp-name b { color: var(--ink); font-weight: 700; }

    .count-badge {
        display: inline-block;
        background: linear-gradient(135deg, var(--success), var(--teal));
        color: #fff;
        font-size: 11.5px;
        font-weight: 700;
        padding: 4px 14px;
        border-radius: 999px;
        letter-spacing: .3px;
    }
    .badge-wrap { text-align: center; margin-bottom: 14px; }

    /* ===== Reward name is the hero of the result ===== */
    .reward-item {
        background: var(--success-bg);
        border: 1.5px dashed var(--teal);
        border-radius: 14px;
        padding: 22px 18px;
        margin-bottom: 12px;
        text-align: center;
        animation: pop .35s ease both;
    }
    .reward-item .gift-icon {
        display: block;
        font-size: 32px;
        line-height: 1;
        margin-bottom: 10px;
    }
    .reward-item .name {
        font-size: 21px;
        font-weight: 800;
        color: #0d3d2f;
        line-height: 1.35;
        margin: 0 0 10px;
        word-break: break-word;
    }
    .reward-item .divider {
        width: 36px;
        height: 3px;
        background: linear-gradient(90deg, var(--gold), var(--crimson));
        border-radius: 999px;
        margin: 0 auto 10px;
    }
    .reward-item .meta {
        font-size: 12px;
        color: var(--muted);
        letter-spacing: .2px;
        font-weight: 600;
    }
    /* When there's only one reward, make it even more prominent */
    .reward-item--solo .gift-icon { font-size: 40px; }
    .reward-item--solo .name { font-size: 25px; }

    @keyframes pop {
        from { opacity: 0; transform: translateY(6px) scale(.97); }
        to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    @media (max-width: 380px) {
        body { padding: 20px 10px; }
        .ticket__stub { padding: 20px 18px 16px; }
        .ticket__main { padding: 20px 16px 18px; }
        .reward-item--solo .name { font-size: 22px; }
    }

    .no-result {
        text-align: center;
        color: var(--muted);
        padding: 18px 4px 6px;
        font-size: 14.5px;
        line-height: 1.6;
    }
    .no-result .icon { font-size: 30px; margin-bottom: 6px; display: block; }
    .no-result b { color: var(--ink); }

    .confetti { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
    .confetti i {
        position: absolute;
        top: -12px;
        width: 6px;
        height: 11px;
        border-radius: 1px;
        opacity: .95;
        animation-name: confetti-fall;
        animation-timing-function: ease-in;
        animation-fill-mode: forwards;
    }
    @keyframes confetti-fall {
        to { transform: translateY(160px) rotate(340deg); opacity: 0; }
    }

    footer {
        text-align: center;
        font-size: 11.5px;
        color: var(--muted);
        margin-top: 18px;
        letter-spacing: .2px;
    }

    @media (prefers-reduced-motion: reduce) {
        .reward-item { animation: none; }
        .confetti i { animation: none; opacity: 0; }
    }
</style>
</head>
<body>
<div class="stage-deco"></div>

<div class="ticket-wrap">
    <div class="ticket">
        <div class="ticket__stub">
            
            <div class="brand">FUJIKOKI</div>
            <h1>LUCKY DRAW</h1>
            <div class="event">New Year Party 2026</div>
        </div>
        <div class="perforation"></div>
        <div class="ticket__main">
            <p class="prompt">กรอกรหัสพนักงานเพื่อตรวจสอบผลรางวัล</p>

            <form id="searchForm">
                <input type="text" id="empCode" placeholder="รหัสพนักงาน เช่น PN0001" autofocus required>
                <button type="submit">ค้นหา</button>
            </form>

            <div id="result"></div>

            <footer>ระบบค้นหาข้อมูลของคุณเท่านั้น</footer>
        </div>
    </div>
</div>

<script>
const WINNERS = [{"code":"PD1068","name":"ณัฐกาล ซาเสน","reward":"ทองรูปพรรณ 1 สลึง","dep":"PD.1","plant":"SB","group":"FKTH"},{"code":"PD1119","name":"ชนานันท์ ม่องวา","reward":"TV LED Android 50\u0022 ","dep":"PD.1","plant":"SB","group":"FKTH"},{"code":"PD1517","name":"ณัฐกมล ยัดดี","reward":"ทองรูปพรรณ 2 สลึง","dep":"PD.1","plant":"SB","group":"FKTH"},{"code":"PN1053","name":"รัตนศักดิ์ เดชาอนุสรณ์","reward":"ตู้เย็น 2 ประตู 8.8 Q. ","dep":"PN","plant":"SB","group":"FKTH"},{"code":"PN1508","name":"รัชนีกร วรรณกุล","reward":"เครื่องซักผ้าอัตโนมัติ 17 Kg.","dep":"PN","plant":"SB","group":"FKTH"},{"code":"MP3442","name":"กฤษณะศักดิ์ โพธิ์ระย้า","reward":"เครื่องซักผ้าอัตโนมัติ 17 Kg.","dep":"PCNK","plant":"NK","group":"SUB"},{"code":"MP3405","name":"ชัยพิชิต วงค์ชัยเวช","reward":"TV LED Android 50\u0022 ","dep":"PD.1","plant":"SB","group":"SUB"},{"code":"MP3610","name":"ชญานิศ พันธ์จุล","reward":"ตู้เย็น 2 ประตู 8.8 Q. ","dep":"PD.1","plant":"SB","group":"SUB"},{"code":"MP3285","name":"วรรณิภา เชื้ออินทร์","reward":"ทองรูปพรรณ 2 สลึง","dep":"PD.2","plant":"SB","group":"SUB"},{"code":"MP3552","name":"วรรณวิษา ปานสุรินทร์","reward":"ทองรูปพรรณ 1 สลึง","dep":"PD.2","plant":"SB","group":"SUB"}];

const form = document.getElementById('searchForm');
const empCodeInput = document.getElementById('empCode');
const resultDiv = document.getElementById('result');

function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str ?? '';
    return div.innerHTML;
}

function launchConfetti(container, count) {
    const colors = ['#ffb703', '#ff4d6d', '#00c2a8', '#7c3aed', '#ffe066'];
    let pieces = '';
    for (let i = 0; i < count; i++) {
        const left = Math.random() * 100;
        const delay = (Math.random() * 0.25).toFixed(2);
        const dur = (0.8 + Math.random() * 0.6).toFixed(2);
        const rot = Math.floor(Math.random() * 360);
        const color = colors[i % colors.length];
        pieces += `<i style="left:${left}%;background:${color};animation-delay:${delay}s;animation-duration:${dur}s;transform:rotate(${rot}deg)"></i>`;
    }
    container.innerHTML = pieces;
    setTimeout(() => { container.innerHTML = ''; }, 1700);
}

form.addEventListener('submit', function (e) {
    e.preventDefault();
    const code = empCodeInput.value.trim();
    if (!code) return;

    const matches = WINNERS.filter(
        w => (w.code || '').toLowerCase() === code.toLowerCase()
    );

    if (matches.length === 0) {
        resultDiv.innerHTML = `
            <div class="no-result">
                <span class="icon">🎫</span>
                ไม่พบผลรางวัลสำหรับรหัสพนักงาน<br>
                <b>"${escapeHtml(code)}"</b><br>
                            </div>`;
        return;
    }

    let html = `
        <div class="confetti"></div>
        <div class="emp-name">คุณ <b>${escapeHtml(matches[0].name)}</b> (${escapeHtml(matches[0].code)})</div>
        <div class="badge-wrap">
            <span class="count-badge">🎉 ได้รับรางวัลทั้งหมด ${matches.length} รายการ</span>
        </div>`;

    matches.forEach(w => {
        html += `
            <div class="reward-item">
                <div class="name">🎁 ${escapeHtml(w.reward)}</div>
                
            </div>`;
    });

    resultDiv.innerHTML = html;
    launchConfetti(resultDiv.querySelector('.confetti'), 18);
});
</script>
</body>
</html>
