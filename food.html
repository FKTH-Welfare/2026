<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>รายการเมนูอาหาร</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, "Noto Sans Thai", sans-serif;
      background: linear-gradient(160deg, #fff7f0 0%, #fbeae5 45%, #f7dede 100%);
      background-attachment: fixed;
      color: #333;
      min-height: 100vh;
    }

    .container {
      max-width: 900px;
      margin: auto;
      background: rgba(255,255,255,0.85);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      padding: 22px;
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(139,30,30,0.12), 0 2px 6px rgba(0,0,0,0.06);
      animation: containerIn 0.6s ease both;
    }

    @keyframes containerIn {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    h1 {
      text-align: center;
      margin: 0 0 22px;
      color: #8b1e1e;
      font-size: 28px;
      letter-spacing: 0.5px;
      text-shadow: 0 2px 6px rgba(139,30,30,0.15);
      position: relative;
      padding-bottom: 12px;
    }

    h1::after {
      content: "";
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 70px;
      height: 3px;
      border-radius: 3px;
      background: linear-gradient(90deg, #e0a458, #8b1e1e, #e0a458);
      background-size: 200% 100%;
      animation: shimmerLine 2.5s linear infinite;
    }

    @keyframes shimmerLine {
      0%   { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    .menu-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    .menu-item {
      display: flex;
      align-items: center;
      gap: 15px;
      padding: 12px;
      background: #fff;
      border: 1px solid #f1e2e2;
      border-radius: 16px;
      box-shadow: 0 4px 14px rgba(139,30,30,0.08);
      transition: transform 0.25s ease, box-shadow 0.25s ease, background 0.25s ease;
      opacity: 0;
      transform: translateY(16px) scale(0.97);
      animation: itemIn 0.5s ease forwards;
      position: relative;
      overflow: hidden;
    }

    .menu-item:nth-child(1)  { animation-delay: 0.05s; }
    .menu-item:nth-child(2)  { animation-delay: 0.10s; }
    .menu-item:nth-child(3)  { animation-delay: 0.15s; }
    .menu-item:nth-child(4)  { animation-delay: 0.20s; }
    .menu-item:nth-child(5)  { animation-delay: 0.25s; }
    .menu-item:nth-child(6)  { animation-delay: 0.30s; }
    .menu-item:nth-child(7)  { animation-delay: 0.35s; }
    .menu-item:nth-child(8)  { animation-delay: 0.40s; }
    .menu-item:nth-child(9)  { animation-delay: 0.45s; }
    .menu-item:nth-child(10) { animation-delay: 0.50s; }

    @keyframes itemIn {
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .menu-item:hover {
      background: #fff3f3;
      transform: translateY(-3px);
      box-shadow: 0 8px 18px rgba(139,30,30,0.15);
    }

    .menu-item:active {
      transform: scale(0.97);
      background: #ffece9;
      box-shadow: 0 2px 6px rgba(139,30,30,0.12);
    }

    .image-wrap {
      position: relative;
      width: 100px;
      height: 100px;
      min-width: 100px;
      border-radius: 50%;
    }

    .food-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      border-radius: 50%;
      border: 3px solid #fff;
      box-shadow: 0 3px 10px rgba(0,0,0,0.2);
      transition: transform 0.3s ease;
    }

    .menu-item:hover .food-image,
    .menu-item:active .food-image {
      transform: scale(1.06) rotate(-2deg);
    }

    .number {
      position: absolute;
      top: -4px;
      left: -4px;
      width: 30px;
      height: 30px;
      min-width: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #b23a3a, #8b1e1e);
      color: white;
      border-radius: 50%;
      font-weight: bold;
      font-size: 14px;
      box-shadow: 0 3px 8px rgba(0,0,0,0.35);
      z-index: 2;
      border: 2px solid #fff;
    }

    .food-name {
      font-size: 18px;
      font-weight: 600;
      line-height: 1.4;
    }

    @media (max-width: 600px) {

      body {
        padding: 10px;
      }

      .container {
        padding: 14px;
        border-radius: 14px;
      }

      h1 {
        font-size: 22px;
      }

      .menu-grid {
        grid-template-columns: 1fr;
        gap: 10px;
      }

      .image-wrap {
        width: 80px;
        height: 80px;
        min-width: 80px;
      }

      .food-name {
        font-size: 15px;
      }

      .number {
        width: 26px;
        height: 26px;
        min-width: 26px;
        font-size: 13px;
      }
    }
  </style>
</head>
